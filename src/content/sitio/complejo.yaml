    foto: ../../assets/fotos/finde/fogon.jpg
    fotoAlt: Fuego encendido en un fogón al aire libre
  - cuando: Sábado
    titulo: Spa en el predio
    texto: 'Piletas climatizadas en el Spa Termas del Sol, ahí mismo. Condiciones: [a confirmar].'
    foto: ../../assets/fotos/finde/spa.jpg
    fotoAlt: Pileta al aire libre con las sierras de fondo
  - cuando: Domingo, a la mañana
    titulo: Desayuno con vista
    texto: 'Café con las sierras enfrente. Desayuno incluido: [a confirmar]. Salida hasta las [a confirmar].'
    foto: ../../assets/fotos/finde/desayuno.jpg
    fotoAlt: Barra frente a los ventanales con vista a las sierras
