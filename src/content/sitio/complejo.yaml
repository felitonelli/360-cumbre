finde:
  - cuando: Viernes, a la tarde
    titulo: La llegada
    texto: 'Abren la puerta y la casa ya está lista. Ingreso desde las [a confirmar].'
    foto: ../../assets/fotos/finde/llegada.jpg
    fotoAlt: Living con techo de madera, sillones y el sol entrando por la puerta
  - cuando: A la tarde
    titulo: La tarde en el deck
    texto: Mate o vino en el deck, con el bosque y las sierras enfrente. Ustedes, sin apuro.
    foto: ../../assets/fotos/finde/atardecer.jpg
    fotoAlt: Deck techado con mesa de madera y dos sillas, frente al bosque de pinos con niebla
