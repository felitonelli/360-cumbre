seo:
  titulo: Cabañas en El Durazno para parejas | 360 Cumbre
  descripcion: >-
    Casas de montaña para parejas en El Durazno, Villa Yacanto (Calamuchita,
    Córdoba), en el mismo predio que el Spa Termas del Sol. Consultá
    disponibilidad.
portadaUbicacion: El Durazno · Calamuchita
portadaTexto: Un fin de semana para ustedes dos, con las sierras de fondo.
fotoPortadaDia: ../../assets/fotos/sitio/portadaDia.jpg
fotoPortadaDiaAlt: Sierras de Córdoba con la luz de la tarde
fotoPortadaNoche: ../../assets/fotos/sitio/portadaNoche.jpg
fotoPortadaNocheAlt: Crestas de las sierras al atardecer, una detrás de otra
secciones:
  cabanas:
    sobretitulo: Las casas
    titulo: Pensadas _para dos_
    texto: >-
      Cabañas de montaña para parejas en El Durazno: madera, piedra y un deck
      para mirar las sierras. Cuántas son y qué tiene cada una: [a confirmar].
  spa:
    sobretitulo: En el mismo predio
    titulo: Spa _Termas del Sol_
    texto: >-
      Las casas están en el mismo predio que el Spa Termas del Sol, un complejo
      de piletas climatizadas de El Durazno. Lo tienen ahí nomás, sin agarrar
      el auto.
  zona:
    sobretitulo: Dónde estamos
    titulo: El Durazno
    texto: >-
      Un paraje serrano del Valle de Calamuchita, cerca de Villa Yacanto, al
      pie de las Sierras Grandes. Río, senderos y silencio, con el Champaquí
      —el cerro más alto de Córdoba— de fondo.
  finde:
    sobretitulo: Un fin de semana en 360 Cumbre
    titulo: Del viernes _al domingo_
    texto: Así puede ser una escapada de dos noches. Los horarios son de referencia.
  testimonios:
    sobretitulo: Lo que dicen los huéspedes
    titulo: Volvieron _distintos_
    texto: ''
  faq:
    sobretitulo: Antes de reservar
    titulo: Preguntas _frecuentes_
    texto: ''
  comoLlegar:
    sobretitulo: Cómo llegar
    titulo: El camino _a la cumbre_
    texto: >-
      El Durazno queda en el Valle de Calamuchita, pasando Villa Yacanto. Las
      indicaciones exactas para llegar a las casas: [a confirmar].
  consulta:
    sobretitulo: Consultá disponibilidad
    titulo: Elegí _tus fechas_
    texto: >-
      Te armamos el mensaje y lo mandás por WhatsApp. No guardamos ningún
      dato.
spa:
  puntos:
    - titulo: Qué es
      texto: Un complejo de piletas climatizadas en El Durazno.
    - titulo: Para los huéspedes
      texto: 'Si el acceso está incluido o tiene descuento: [a confirmar].'
    - titulo: Horarios
      texto: '[a confirmar]'
  foto: ../../assets/fotos/sitio/fotoSpa.jpg
  fotoAlt: Pileta al aire libre rodeada de pasto, con las sierras de fondo
zona:
  puntos:
    - icono: waves
      titulo: El río
      texto: 'El río El Durazno, para caminar por la orilla. Distancia: [a confirmar].'
    - icono: map-pin
      titulo: Villa Yacanto
      texto: 'El pueblo más cercano, para hacer las compras. Distancia: [a confirmar].'
    - icono: mountain
      titulo: El Champaquí
      texto: 'El cerro más alto de Córdoba, de fondo. Excursiones desde la zona: [a confirmar].'
  foto: ../../assets/fotos/sitio/fotoZona.jpg
